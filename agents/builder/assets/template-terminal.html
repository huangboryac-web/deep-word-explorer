<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{WORD}} · 深度解析 | WorkBuddy</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f2418;--ink-rgb:15,36,24;--paper:#eef7ef;--paper-rgb:238,247,239;--paper-tint:#d8ecd9;--ink-tint:#0a7a3d;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --content-width:760px;
  --space-1:.25rem;--space-2:.5rem;--space-3:1rem;--space-4:1.5rem;--space-5:2.5rem;--space-6:4rem;
  --radius-sm:0;--radius-md:0;--radius-lg:0;
  --shadow-sm:3px 3px 0 rgba(var(--ink-rgb),.10);
  --shadow-md:6px 6px 0 rgba(var(--ink-rgb),.12);
  --shadow-lg:12px 12px 0 rgba(var(--ink-rgb),.14);
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --dur-fast:.18s;--dur-med:.38s;--dur-slow:.7s;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--mono);font-size:15px;line-height:1.95;letter-spacing:.01em;
  background:var(--paper);color:var(--ink);overflow-x:hidden;
  transition:background var(--dur-med) var(--ease-out),color var(--dur-med) var(--ease-out);
}
body.theme-dark{background:var(--ink);color:var(--paper)}
/* 扫描线 + 顶部微光 */
body::before{
  content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(15,36,24,.055) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;animation:dw-scan 9s linear infinite;
}
body.theme-dark::before{
  background:repeating-linear-gradient(0deg,rgba(238,247,239,.045) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen;
}
body::after{
  content:"";position:fixed;top:-30vh;left:50%;transform:translateX(-50%);
  width:120vw;height:60vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center,rgba(10,122,61,.14),transparent 65%);
}
@keyframes dw-scan{0%{background-position:0 0}100%{background-position:0 6px}}
a{color:var(--ink-tint)}
::selection{background:var(--ink-tint);color:var(--paper)}
#progress-bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--ink-tint),#7fd8a4);z-index:300;transition:width .08s linear}
/* 顶栏 */
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:.55rem 1.2rem;background:var(--ink);color:var(--paper);font-size:.76rem;letter-spacing:.06em;
  box-shadow:0 2px 0 rgba(var(--ink-tint),.35);
}
body.theme-dark .topbar{background:var(--paper);color:var(--ink)}
.topbar .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:.5rem;flex-shrink:0}
.term-btn{
  display:inline-flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.7rem;
  padding:.28rem .6rem;background:transparent;border:1px solid currentColor;color:inherit;cursor:pointer;
  border-radius:var(--radius-sm);transition:background var(--dur-fast),color var(--dur-fast),transform var(--dur-fast);
}
.term-btn:hover{background:var(--ink-tint);color:var(--paper);border-color:var(--ink-tint)}
.term-btn:active{transform:translateY(1px)}
.term-btn:focus-visible{outline:2px solid var(--ink-tint);outline-offset:2px}
/* hero */
.hero{max-width:var(--content-width);margin:0 auto;padding:4.6rem 1.5rem 2.4rem;position:relative;z-index:1}
.hero .prompt{
  margin:0 0 .9rem;font-size:.86rem;color:var(--ink-tint);letter-spacing:.03em;
  text-shadow:0 0 14px rgba(10,122,61,.35);opacity:0;transform:translateY(14px);
  animation:dw-fade-up var(--dur-slow) var(--ease-out) .05s forwards;
}
.hero h1{
  position:relative;
  font-size:clamp(2rem,5vw,3.5rem);line-height:1.16;text-transform:uppercase;letter-spacing:.07em;
  border-left:4px solid var(--ink-tint);padding-left:.75rem;margin:0 0 1.1rem;opacity:0;transform:translateY(14px);
  animation:dw-fade-up var(--dur-slow) var(--ease-out) .12s forwards;
}
.hero h1::before{
  content:attr(data-word);position:absolute;left:-.14em;top:-.26em;z-index:-1;pointer-events:none;
  font-size:1.5em;line-height:1;letter-spacing:.07em;text-transform:uppercase;color:transparent;
  -webkit-text-stroke:1px rgba(10,122,61,.30);opacity:.75;
}
.hero h1::after{content:"▊";color:var(--ink-tint);margin-left:.12em;animation:dw-blink 1.1s steps(2) infinite}
.hero .tagline{
  font-size:.98rem;opacity:.84;max-width:64ch;margin:0 0 1.5rem;line-height:1.95;opacity:0;transform:translateY(14px);
  animation:dw-fade-up var(--dur-slow) var(--ease-out) .2s forwards;
}
.chain-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem;opacity:0;transform:translateY(14px);animation:dw-fade-up var(--dur-slow) var(--ease-out) .28s forwards}
.chain-row a{
  font-size:.75rem;text-decoration:none;border:1px solid var(--ink-tint);color:var(--ink-tint);
  padding:.14rem .45rem;border-radius:var(--radius-sm);transition:background var(--dur-fast),color var(--dur-fast),box-shadow var(--dur-fast);
}
.chain-row a:hover,.chain-row a.active{background:var(--ink-tint);color:var(--paper);box-shadow:var(--shadow-sm)}
@keyframes dw-fade-up{to{opacity:1;transform:none}}
@keyframes dw-blink{50%{opacity:0}}
/* 正文 */
.wrap{max-width:var(--content-width);margin:0 auto;padding:0 1.5rem 5rem;position:relative;z-index:1}
main section{
  position:relative;overflow:hidden;
  margin:2.1rem 0;padding:1.4rem 1.5rem;border:1px solid var(--paper-tint);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-sm);background:rgba(var(--paper-rgb),.55);
  opacity:0;transform:translateY(20px);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
main section[data-chain]::before{
  content:"0" attr(data-chain);position:absolute;right:.18em;top:-.38em;pointer-events:none;user-select:none;
  font-size:clamp(4rem,9vw,7rem);line-height:1;font-weight:700;color:var(--ink-tint);opacity:.10;
}
body.theme-dark main section{background:rgba(var(--ink-rgb),.45)}
main section.visible{opacity:1;transform:none}
main section h2{font-size:1.24rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 1rem}
main section h2::before{content:"// ";color:var(--ink-tint)}
main section h3{font-size:1.02rem;text-transform:uppercase;letter-spacing:.04em;margin:1.5rem 0 .6rem}
main section h4{font-size:.96rem;margin:1.2rem 0 .5rem}
main section p{margin:.55rem 0}
main section ul,main section ol{margin:.55rem 0;padding-left:1.35rem}
main section li{margin:.35rem 0}
.transition-question{
  text-align:center;border:1px dashed var(--ink-tint);border-radius:var(--radius-sm);padding:1.1rem 1.25rem;margin:2.6rem 0;
  font-size:.98rem;opacity:0;transform:translateY(18px);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.transition-question.visible{opacity:1;transform:none}
.transition-question p{margin:0}
.callout{border-left:4px solid var(--ink-tint);padding:.55rem 1rem;background:rgba(var(--ink-rgb),.04);border-radius:var(--radius-sm)}
.lead{font-size:1.02rem}
.timeline-list{list-style:none;padding:0}
.timeline-list li{padding-left:1.3rem;position:relative;margin:.45rem 0}
.timeline-list li::before{content:"▸";position:absolute;left:0;color:var(--ink-tint)}
.stat-row{display:flex;flex-wrap:wrap;gap:1.3rem;margin:1rem 0}
.stat-item .num{font-size:2.1rem;font-weight:700;color:var(--ink-tint);font-variant-numeric:tabular-nums}
.big-num{font-size:2.7rem;font-weight:700;color:var(--ink-tint);font-variant-numeric:tabular-nums}
.comparison-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
.comparison-table th,.comparison-table td{border:1px solid var(--paper-tint);padding:.5rem .65rem;text-align:left}
.comparison-table th{background:rgba(var(--ink-rgb),.05)}
.references{
  margin-top:4rem;padding-top:1.9rem;border-top:2px solid var(--ink-tint);
  opacity:0;transform:translateY(20px);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.references.visible{opacity:1;transform:none}
.references ol{line-height:1.95;padding-left:1.4rem}
.references a{word-break:break-all}
.abbr-term{border-bottom:1px dotted var(--ink-tint);cursor:help;transition:color var(--dur-fast)}
.abbr-term:hover{color:var(--ink-tint)}
.citation-ref{color:var(--ink-tint);font-size:.72em;vertical-align:super;cursor:pointer;transition:opacity var(--dur-fast)}
.citation-ref:hover{opacity:.65}
.tooltip,.cite-popup{
  position:fixed;z-index:3000;max-width:300px;padding:.55rem .8rem;font-size:.78rem;line-height:1.65;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink-tint);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity var(--dur-fast),transform var(--dur-fast);
}
body.theme-dark .tooltip,body.theme-dark .cite-popup{background:var(--paper);color:var(--ink)}
.tooltip.show,.cite-popup.show{opacity:1;transform:none}
footer.statusbar{
  position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:.42rem 1.2rem;background:var(--ink);color:var(--paper);font-size:.7rem;letter-spacing:.04em;
}
body.theme-dark footer.statusbar{background:var(--paper);color:var(--ink)}
footer.statusbar .cursor{display:inline-block;width:.55em;height:1em;background:var(--ink-tint);vertical-align:middle;animation:dw-blink 1.1s steps(2) infinite}
main{padding-bottom:3rem}
@media(max-width:768px){
  .topbar .crumb{max-width:44vw}
  .hero{padding-top:3.4rem}
  .wrap{padding:0 1rem 4.5rem}
  main section{padding:1rem}
  .hero h1{font-size:1.7rem}
}
@media print{
  .topbar,footer.statusbar,#progress-bar,.term-btn,body::before,body::after{display:none!important}
  body{background:#fff!important;color:#000!important}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  main section,.transition-question,.references,.hero .prompt,.hero h1,.hero .tagline,.chain-row{opacity:1!important;transform:none!important}
}
</style>
</head>
<body class="theme-light theme-phosphor-terminal">
<div id="progress-bar"></div>
<header class="topbar">
  <span class="crumb">~/explorer/{{WORD}}.md</span>
  <span class="actions">
    <button class="term-btn" id="theme-toggle" aria-label="切换明暗"><i data-lucide="moon"></i><span>dark:off</span></button>
    <button class="term-btn" id="export-pdf" aria-label="导出 PDF"><i data-lucide="printer"></i><span>save</span></button>
  </span>
</header>
<div class="hero">
  <p class="prompt">$ deep-explore {{WORD}} --tier {{TIER_LABEL}}</p>
  <h1 data-word="{{WORD}}">{{WORD}}</h1>
  <p class="tagline">{{TAGLINE}}</p>
  <nav class="chain-row" id="chain-indicator" aria-label="学习链导航"></nav>
</div>
<main class="wrap">
{{BODY}}
</main>
<footer class="statusbar"><span>deep-word-explorer · {{FOOTER}}</span><span>█<span class="cursor"></span></span></footer>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
var secs=[].slice.call(document.querySelectorAll('main section[data-chain]'));
var nav=document.getElementById('chain-indicator');
secs.forEach(function(s){var a=document.createElement('a');a.href='#'+s.id;a.textContent=String(Number(s.dataset.chain)).padStart(2,'0');nav.appendChild(a);});
var bar=document.getElementById('progress-bar');
function refresh(){
  var t=document.documentElement.scrollTop,h=document.documentElement.scrollHeight-window.innerHeight;
  bar.style.width=(h>0?t/h*100:0)+'%';
  var cur='';secs.forEach(function(s){if(t>=s.offsetTop-160)cur=s.id;});
  [].forEach.call(nav.querySelectorAll('a'),function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+cur);});
}
window.addEventListener('scroll',refresh,{passive:true});refresh();
var reveal=[].slice.call(document.querySelectorAll('main section,.transition-question,.references'));
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:.12});
  reveal.forEach(function(el){io.observe(el);});
}else{reveal.forEach(function(el){el.classList.add('visible');});}
document.querySelectorAll('.abbr-term').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='tooltip';d.textContent=el.dataset.tooltip||el.title||'';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';
    requestAnimationFrame(function(){d.classList.add('show');});el._t=d;
  });
  el.addEventListener('mouseleave',function(){if(el._t){el._t.remove();el._t=null;}});
});
document.querySelectorAll('.citation-ref').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='cite-popup';d.textContent=el.dataset.citeText||'查看底部参考文献';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';
    requestAnimationFrame(function(){d.classList.add('show');});el._c=d;
  });
  el.addEventListener('mouseleave',function(){if(el._c){el._c.remove();el._c=null;}});
});
var tb=document.getElementById('theme-toggle');
function applyDark(dark){
  document.body.classList.toggle('theme-dark',dark);
  document.body.classList.toggle('theme-light',!dark);
  tb.querySelector('i').setAttribute('data-lucide',dark?'sun':'moon');
  tb.querySelector('span').textContent=dark?'dark:on':'dark:off';
  lucide.createIcons();
}
tb.addEventListener('click',function(){applyDark(!document.body.classList.contains('theme-dark'));});
if(localStorage.getItem('dw-theme')==='dark'){applyDark(true);}
document.getElementById('export-pdf').addEventListener('click',function(){window.print();});
</script>
</body>
</html>
