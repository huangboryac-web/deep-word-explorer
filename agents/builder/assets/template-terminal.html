<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{WORD}} · 深度解析 | WorkBuddy</title>
<meta name="description" content="{{TAGLINE}}">
<style>
:root{--ink:#0f2418;--ink-rgb:15,36,24;--paper:#eef7ef;--paper-rgb:238,247,239;--paper-tint:#d8ecd9;--ink-tint:#0a7a3d;--mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;--content-width:760px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--mono);font-size:16px;line-height:1.8;background:var(--paper);color:var(--ink);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(15,36,24,.05) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
body.theme-dark{background:var(--ink);color:var(--paper)}
body.theme-dark::before{background:repeating-linear-gradient(0deg,rgba(238,247,239,.04) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
a{color:var(--ink-tint)}
::selection{background:var(--ink-tint);color:var(--paper)}
#progress-bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ink-tint);z-index:300}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1.2rem;background:var(--ink);color:var(--paper);font-size:.76rem;letter-spacing:.08em}
body.theme-dark .topbar{background:var(--paper);color:var(--ink)}
.topbar .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:.55rem;flex-shrink:0}
.term-btn{font-family:var(--mono);font-size:.7rem;padding:.25rem .6rem;background:transparent;border:1px solid currentColor;color:inherit;cursor:pointer;border-radius:0}
.term-btn:hover{background:var(--ink-tint);color:var(--paper);border-color:var(--ink-tint)}
.hero{max-width:var(--content-width);margin:0 auto;padding:4.2rem 1.5rem 2.2rem}
.hero .prompt{margin:0 0 .8rem;font-size:.85rem;color:var(--ink-tint)}
.hero h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.15;text-transform:uppercase;letter-spacing:.06em;border-left:4px solid var(--ink-tint);padding-left:.75rem;margin:0 0 1rem}
.hero h1::after{content:"▊";color:var(--ink-tint);margin-left:.12em;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.hero .tagline{font-size:.98rem;opacity:.82;max-width:64ch;margin:0 0 1.4rem;line-height:1.9}
.chain-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
.chain-row a{font-size:.75rem;text-decoration:none;border:1px solid var(--ink-tint);color:var(--ink-tint);padding:.12rem .4rem}
.chain-row a.active,.chain-row a:hover{background:var(--ink-tint);color:var(--paper)}
.wrap{max-width:var(--content-width);margin:0 auto;padding:0 1.5rem 4.5rem}
main section{margin:2.1rem 0;padding:1.35rem 1.5rem;border:1px solid var(--paper-tint);box-shadow:4px 4px 0 rgba(var(--ink-rgb),.07);border-radius:0}
main section h2{font-size:1.22rem;text-transform:uppercase;letter-spacing:.05em;margin:0 0 1rem}
main section h2::before{content:"// ";color:var(--ink-tint)}
main section h3{font-size:1.02rem;text-transform:uppercase;letter-spacing:.04em;margin:1.4rem 0 .6rem}
main section h4{font-size:.95rem;margin:1.2rem 0 .5rem}
main section p{margin:.55rem 0}
main section ul,main section ol{margin:.55rem 0;padding-left:1.3rem}
main section li{margin:.35rem 0}
.transition-question{text-align:center;border:1px dashed var(--ink-tint);padding:1.05rem 1.2rem;margin:2.4rem 0;font-size:.98rem}
.transition-question p{margin:0}
.callout{border-left:4px solid var(--ink-tint);padding:.55rem 1rem;background:rgba(var(--ink-rgb),.04);border-radius:0}
.lead{font-size:1.02rem}
.timeline-list{list-style:none;padding:0}
.timeline-list li{padding-left:1.25rem;position:relative;margin:.45rem 0}
.timeline-list li::before{content:"▸";position:absolute;left:0;color:var(--ink-tint)}
.stat-row{display:flex;flex-wrap:wrap;gap:1.2rem;margin:1rem 0}
.stat-item .num{font-size:1.6rem;color:var(--ink-tint)}
.big-num{font-size:2rem;color:var(--ink-tint)}
.comparison-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
.comparison-table th,.comparison-table td{border:1px solid var(--paper-tint);padding:.5rem .65rem;text-align:left}
.comparison-table th{background:rgba(var(--ink-rgb),.05)}
.references{margin-top:4rem;padding-top:1.8rem;border-top:2px solid var(--ink-tint)}
.references ol{line-height:1.9;padding-left:1.4rem}
.references a{word-break:break-all}
.abbr-term{border-bottom:1px dotted var(--ink-tint);cursor:help}
.citation-ref{color:var(--ink-tint);font-size:.72em;vertical-align:super;cursor:pointer}
.tooltip,.cite-popup{position:fixed;z-index:3000;max-width:300px;padding:.55rem .8rem;font-size:.78rem;line-height:1.6;background:var(--ink);color:var(--paper);border:1px solid var(--ink-tint);box-shadow:4px 4px 0 rgba(var(--ink-rgb),.2);pointer-events:none;border-radius:0}
body.theme-dark .tooltip,body.theme-dark .cite-popup{background:var(--paper);color:var(--ink)}
footer.statusbar{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.4rem 1.2rem;background:var(--ink);color:var(--paper);font-size:.7rem;letter-spacing:.05em}
body.theme-dark footer.statusbar{background:var(--paper);color:var(--ink)}
footer.statusbar .cursor{display:inline-block;width:.55em;height:1em;background:var(--ink-tint);vertical-align:middle;animation:blink 1.1s steps(2) infinite}
main{padding-bottom:3rem}
@media(max-width:768px){.topbar .crumb{max-width:46vw}.hero{padding-top:3.2rem}.wrap{padding:0 1rem 4rem}main section{padding:1rem}.hero h1{font-size:1.7rem}}
@media print{.topbar,footer.statusbar,#progress-bar,.term-btn{display:none!important}body{background:#fff!important;color:#000!important}}
</style>
</head>
<body class="theme-light theme-phosphor-terminal">
<div id="progress-bar"></div>
<header class="topbar"><span class="crumb">~/explorer/{{WORD}}.md</span><span class="actions"><button class="term-btn" id="theme-toggle" aria-label="切换明暗">dark:off</button><button class="term-btn" id="export-pdf" aria-label="导出 PDF">&gt; save pdf</button></span></header>
<div class="hero">
<p class="prompt">$ deep-explore {{WORD}} --tier deep×pro×panorama</p>
<h1>{{WORD}}</h1>
<p class="tagline">{{TAGLINE}}</p>
<nav class="chain-row" id="chain-indicator" aria-label="学习链导航"></nav>
</div>
<main class="wrap">
{{BODY}}
</main>
<footer class="statusbar"><span>deep-word-explorer · {{FOOTER}}</span><span>█<span class="cursor"></span></span></footer>
<script>
var secs=[].slice.call(document.querySelectorAll('main section[data-chain]'));
var nav=document.getElementById('chain-indicator');
secs.forEach(function(s){var a=document.createElement('a');a.href='#'+s.id;a.textContent=s.dataset.chain;nav.appendChild(a);});
window.addEventListener('scroll',function(){
  var t=document.documentElement.scrollTop,h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('progress-bar').style.width=(h>0?t/h*100:0)+'%';
  var cur='';secs.forEach(function(s){if(t>=s.offsetTop-160)cur=s.id;});
  [].forEach.call(nav.querySelectorAll('a'),function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+cur);});
},{passive:true});
document.querySelectorAll('.abbr-term').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='tooltip';d.textContent=el.dataset.tooltip||el.title||'';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';el._t=d;
  });
  el.addEventListener('mouseleave',function(){if(el._t){el._t.remove();el._t=null;}});
});
document.querySelectorAll('.citation-ref').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='cite-popup';d.textContent=el.dataset.citeText||'查看底部参考文献';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';el._c=d;
  });
  el.addEventListener('mouseleave',function(){if(el._c){el._c.remove();el._c=null;}});
});
var tb=document.getElementById('theme-toggle');
tb.addEventListener('click',function(){
  var dark=document.body.classList.toggle('theme-dark');
  document.body.classList.toggle('theme-light');
  tb.textContent=dark?'dark:on':'dark:off';
});
document.getElementById('export-pdf').addEventListener('click',function(){window.print();});
</script>
</body>
</html>
