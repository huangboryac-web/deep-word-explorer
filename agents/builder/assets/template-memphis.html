<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{WORD}} · 深度解析 | WorkBuddy</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26232a;--ink-rgb:38,35,42;--paper:#fff6ec;--paper-rgb:255,246,236;--paper-tint:#ffe0c7;--ink-tint:#d6336c;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --display:"Archivo Black",var(--sans);
  --content-width:1080px;
  --space-1:.25rem;--space-2:.5rem;--space-3:1rem;--space-4:1.5rem;--space-5:2.5rem;--space-6:4rem;
  --radius-sm:10px;--radius-md:14px;--radius-lg:22px;
  --shadow-sm:3px 3px 0 var(--ink);
  --shadow-md:6px 6px 0 var(--ink-tint);
  --shadow-lg:10px 10px 0 var(--ink);
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --dur-fast:.18s;--dur-med:.4s;--dur-slow:.75s;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);font-size:16.5px;line-height:1.82;background:var(--paper);color:var(--ink);overflow-x:hidden;
  transition:background var(--dur-med) var(--ease-out),color var(--dur-med) var(--ease-out);
}
body.theme-dark{background:var(--ink);color:var(--paper)}
/* 漂浮形状层 */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 12% 18%,rgba(214,51,108,.16) 0 20px,transparent 21px),
    radial-gradient(circle at 88% 12%,rgba(10,122,61,.13) 0 13px,transparent 14px),
    radial-gradient(circle at 78% 82%,rgba(240,120,50,.13) 0 24px,transparent 25px),
    radial-gradient(circle at 18% 86%,rgba(20,90,220,.10) 0 11px,transparent 12px);
  animation:dw-float 26s var(--ease-out) infinite alternate;
}
@keyframes dw-float{
  0%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(-14px,10px) rotate(1.2deg)}
  100%{transform:translate(10px,-8px) rotate(-1deg)}
}
a{color:var(--ink-tint);font-weight:700;text-decoration-thickness:2px;text-underline-offset:2px}
::selection{background:var(--ink-tint);color:var(--paper)}
#progress-bar{position:fixed;top:0;left:0;height:6px;width:0;background:linear-gradient(90deg,var(--ink-tint),#f07832,#ffd23f,var(--ink-tint));background-size:200% 100%;z-index:300;transition:width .08s linear;animation:dw-stripe 2.4s linear infinite}
@keyframes dw-stripe{to{background-position:-200% 0}}
.topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.6rem 1.3rem;background:var(--paper);border-bottom:4px solid var(--ink);
}
body.theme-dark .topbar{background:var(--ink)}
.topbar .logo{
  font-family:var(--display);font-size:1rem;letter-spacing:.03em;background:var(--ink-tint);color:var(--paper);
  padding:.22rem .6rem;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink);
}
.topbar .actions{display:flex;gap:.55rem}
.sticker-btn{
  display:inline-flex;align-items:center;gap:.4rem;font-family:var(--sans);font-weight:900;font-size:.78rem;
  padding:.34rem .72rem;background:var(--paper);color:var(--ink);border:3px solid var(--ink);cursor:pointer;
  box-shadow:3px 3px 0 var(--ink-tint);border-radius:var(--radius-sm);transition:transform var(--dur-fast) var(--ease-pop),box-shadow var(--dur-fast);
}
body.theme-dark .sticker-btn{background:var(--ink);color:var(--paper)}
.sticker-btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink-tint)}
.sticker-btn:hover i{animation:dw-wiggle .32s var(--ease-out)}
@keyframes dw-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.sticker-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink-tint)}
.sticker-btn:focus-visible{outline:3px solid var(--ink-tint);outline-offset:2px}
.ticker{position:relative;z-index:99;overflow:hidden;background:var(--ink-tint);color:var(--paper);font-family:var(--display);font-size:.8rem;letter-spacing:.12em;padding:.32rem 0;border-bottom:3px solid var(--ink)}
.ticker-track{display:inline-flex;white-space:nowrap;animation:dw-marquee 18s linear infinite}
.ticker-track span{padding-right:2.2rem}
@keyframes dw-marquee{to{transform:translateX(-50%)}}
/* hero */
.hero{max-width:var(--content-width);margin:0 auto;padding:4.2rem 1.5rem 2.6rem;position:relative;z-index:1;overflow:hidden}
.hero .shape{position:absolute;pointer-events:none;z-index:0}
.hero .shape-a{width:54px;height:54px;right:12%;top:20%;background:var(--paper-tint);border:3px solid var(--ink);transform:rotate(12deg);animation:dw-shape-a 7s var(--ease-pop) infinite alternate}
.hero .shape-b{width:36px;height:36px;left:9%;bottom:14%;background:transparent;border:3px dashed var(--ink-tint);border-radius:50%;animation:dw-shape-b 9s var(--ease-out) infinite alternate}
@keyframes dw-shape-a{from{transform:rotate(12deg) translateY(0)}to{transform:rotate(24deg) translateY(-16px)}}
@keyframes dw-shape-b{from{transform:translateY(0) scale(1)}to{transform:translateY(-12px) scale(1.18) rotate(24deg)}}
.hero .badge,.hero h1,.hero .tagline{position:relative;z-index:1}
.hero .badge{
  display:inline-block;font-size:.78rem;font-weight:900;letter-spacing:.14em;background:var(--paper-tint);
  border:3px solid var(--ink);padding:.22rem .6rem;margin-bottom:1.15rem;border-radius:var(--radius-sm);
  box-shadow:3px 3px 0 var(--ink-tint);transform:rotate(-1deg);opacity:0;
  animation:dw-pop var(--dur-slow) var(--ease-pop) .05s forwards,dw-sway 6s var(--ease-out) 2.6s infinite alternate;
}
@keyframes dw-sway{from{transform:rotate(-1.5deg)}to{transform:rotate(1deg)}}
.hero h1{
  position:relative;display:inline-block;font-family:var(--display);font-size:clamp(2.4rem,7vw,4.6rem);font-weight:400;line-height:1.08;
  background:var(--ink-tint);color:var(--paper);padding:.12em .34em;margin:0 0 1.1rem;border-radius:var(--radius-sm);
  box-shadow:8px 8px 0 var(--ink);transform:rotate(-1.5deg);opacity:0;
  animation:dw-title-in var(--dur-slow) var(--ease-pop) .15s forwards;
}
.hero h1::before{
  content:attr(data-word);position:absolute;left:.09em;top:.09em;z-index:-1;pointer-events:none;
  font-family:var(--display);font-size:1em;line-height:1;color:transparent;
  -webkit-text-stroke:2px rgba(38,35,42,.30);transform:rotate(-1.5deg);
}
.hero .tagline{
  font-size:1.05rem;max-width:64ch;margin:1.2rem 0 0;line-height:1.85;opacity:.9;opacity:0;transform:translateY(16px);
  animation:dw-fade-up var(--dur-slow) var(--ease-out) .28s forwards;
}
@keyframes dw-pop{0%{opacity:0;transform:scale(.7) rotate(-4deg)}70%{transform:scale(1.06) rotate(-1deg)}100%{opacity:1;transform:scale(1) rotate(-1deg)}}
@keyframes dw-title-in{0%{opacity:0;transform:rotate(-4deg) translateY(18px)}70%{transform:rotate(-1deg) translateY(-2px)}100%{opacity:1;transform:rotate(-1.5deg) translateY(0)}}
@keyframes dw-fade-up{to{opacity:1;transform:none}}
/* 双栏 */
.layout{max-width:var(--content-width);margin:0 auto;padding:0 1.5rem 4rem;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:2.4rem;align-items:start;position:relative;z-index:1}
.article-col{min-width:0;perspective:1200px}
main section{
  position:relative;overflow:hidden;transform-origin:top center;
  margin:2.6rem 0;padding:1.5rem 1.6rem;border:3px solid var(--ink);border-radius:var(--radius-md);
  background:var(--paper);box-shadow:var(--shadow-md);opacity:0;transform:translateY(26px) rotateX(6deg) rotate(.6deg);
  transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out),box-shadow var(--dur-med);
}
main section[data-chain]::before{
  content:"0" attr(data-chain);position:absolute;right:.14em;top:-.45em;z-index:0;pointer-events:none;user-select:none;
  font-family:var(--display);font-size:clamp(4.5rem,11vw,8.5rem);line-height:1;color:var(--paper-tint);
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink-tint);opacity:.55;
}
main section > *{position:relative;z-index:1}
body.theme-dark main section{background:var(--ink)}
main section.visible{opacity:1;transform:rotateX(0) rotate(0) translateY(0)}
main section:hover{box-shadow:var(--shadow-lg)}
main section h2{
  display:inline-block;font-size:1.35rem;font-weight:900;letter-spacing:.01em;border-bottom:4px solid var(--ink-tint);
  padding-bottom:.18rem;margin:0 0 1rem;
}
main section h2::after{content:"✦";color:var(--ink-tint);margin-left:.4em;display:inline-block;animation:dw-spin 8s linear infinite}
@keyframes dw-spin{to{transform:rotate(360deg)}}
main section h3{font-size:1.1rem;font-weight:800;margin:1.5rem 0 .6rem}
main section h4{font-size:1rem;font-weight:800;margin:1.2rem 0 .5rem}
main section p{margin:.6rem 0}
main section ul,main section ol{margin:.6rem 0;padding-left:1.4rem}
main section li{margin:.4rem 0}
.transition-question{
  text-align:center;font-weight:800;background:var(--paper-tint);border:3px solid var(--ink);border-radius:var(--radius-md);
  padding:1.15rem 1.3rem;margin:2.8rem 0;box-shadow:var(--shadow-md);transform:rotate(.5deg);
  opacity:0;transform:translateY(18px) rotate(.5deg);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.transition-question.visible{opacity:1;transform:rotate(.5deg)}
.transition-question p{margin:0}
.callout{border:3px solid var(--ink-tint);border-left-width:9px;border-radius:var(--radius-sm);background:var(--paper-tint);padding:.6rem 1rem;margin:1.2rem 0}
.lead{font-size:1.06rem}
.timeline-list{list-style:none;padding:0}
.timeline-list li{padding-left:1.35rem;position:relative;margin:.5rem 0}
.timeline-list li::before{content:"●";position:absolute;left:0;color:var(--ink-tint)}
.stat-row{display:flex;flex-wrap:wrap;gap:1.4rem;margin:1.1rem 0}
.stat-item .num{font-size:2.3rem;font-weight:900;color:var(--ink-tint);font-variant-numeric:tabular-nums}
.big-num{font-size:3rem;font-weight:900;color:var(--ink-tint);font-variant-numeric:tabular-nums}
.comparison-table{width:100%;border-collapse:collapse;margin:1.1rem 0;font-size:.92rem}
.comparison-table th,.comparison-table td{border:2px solid var(--paper-tint);padding:.55rem .7rem;text-align:left}
.comparison-table th{background:var(--paper-tint);font-weight:800}
.references{
  margin-top:3.5rem;padding:1.6rem;border:3px dashed var(--ink-tint);border-radius:var(--radius-md);background:var(--paper);
  opacity:0;transform:translateY(20px);transition:opacity var(--dur-slow) var(--ease-out),transform var(--dur-slow) var(--ease-out);
}
.references.visible{opacity:1;transform:none}
.references h2{font-size:1.25rem;font-weight:900}
.references ol{line-height:1.9;padding-left:1.4rem}
.references a{word-break:break-all}
.abbr-term{border-bottom:2px dotted var(--ink-tint);cursor:help;font-weight:700;transition:background var(--dur-fast)}
.abbr-term:hover{background:var(--paper-tint)}
.citation-ref{
  display:inline-block;color:var(--paper);background:var(--ink-tint);font-size:.66em;font-weight:800;padding:0 .3em;
  border-radius:4px;vertical-align:super;cursor:pointer;transition:transform var(--dur-fast) var(--ease-pop);
}
.citation-ref:hover{transform:scale(1.15)}
.tooltip,.cite-popup{
  position:fixed;z-index:3000;max-width:300px;padding:.6rem .9rem;font-size:.84rem;line-height:1.7;
  background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-md);pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);
  transition:opacity var(--dur-fast),transform var(--dur-fast) var(--ease-pop);
}
body.theme-dark .tooltip,body.theme-dark .cite-popup{background:var(--ink-tint);color:var(--paper)}
.tooltip.show,.cite-popup.show{opacity:1;transform:none}
/* 右侧贴纸面板 */
.rail{position:sticky;top:6rem;display:flex;flex-direction:column;gap:1rem}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:1rem}
body.theme-dark .panel{background:var(--ink)}
.panel h3{font-size:.82rem;font-weight:900;letter-spacing:.12em;margin:0 0 .8rem;color:var(--ink-tint)}
#memphis-chips{display:flex;flex-direction:column;gap:.45rem}
#memphis-chips a{
  display:block;font-size:.85rem;font-weight:800;text-decoration:none;color:var(--ink);border:2px solid var(--ink);
  padding:.32rem .55rem;border-radius:var(--radius-sm);background:var(--paper);transition:transform var(--dur-fast) var(--ease-pop),box-shadow var(--dur-fast),background var(--dur-fast),color var(--dur-fast);
  opacity:0;transform:translateX(-16px);animation:chip-in .45s var(--ease-pop) forwards;
}
#memphis-chips a:nth-child(1){animation-delay:.8s}
#memphis-chips a:nth-child(2){animation-delay:.9s}
#memphis-chips a:nth-child(3){animation-delay:1s}
#memphis-chips a:nth-child(4){animation-delay:1.1s}
#memphis-chips a:nth-child(5){animation-delay:1.2s}
#memphis-chips a:nth-child(6){animation-delay:1.3s}
#memphis-chips a:nth-child(7){animation-delay:1.4s}
#memphis-chips a:nth-child(8){animation-delay:1.5s}
@keyframes chip-in{to{opacity:1;transform:none}}
body.theme-dark #memphis-chips a{background:var(--ink)}
#memphis-chips a:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink-tint)}
#memphis-chips a.active{background:var(--ink-tint);color:var(--paper);border-color:var(--ink-tint)}
#chain-indicator{display:flex;gap:.4rem;margin-top:.2rem}
#chain-indicator .step{
  width:28px;height:28px;font-size:.74rem;font-weight:900;line-height:22px;text-align:center;border:2px solid var(--ink);
  border-radius:var(--radius-sm);cursor:pointer;background:var(--paper);transition:transform var(--dur-fast) var(--ease-pop),background var(--dur-fast),color var(--dur-fast);
}
body.theme-dark #chain-indicator .step{background:var(--ink)}
#chain-indicator .step:hover{transform:rotate(-4deg) scale(1.08)}
#chain-indicator .step.active{background:var(--ink-tint);color:var(--paper);border-color:var(--ink-tint)}
.article-footer{
  max-width:var(--content-width);margin:0 auto;padding:2rem 1.5rem 3.5rem;font-weight:800;text-align:center;
  border-top:6px solid var(--ink);position:relative;z-index:1;
}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;order:-1;flex-direction:row;flex-wrap:wrap}
  .panel{flex:1;min-width:220px}
}
@media(max-width:768px){
  .hero{padding-top:3rem}
  main section{padding:1rem}
  .hero h1{font-size:1.9rem}
}
@media print{
  .topbar,.rail,.sticker-btn,#progress-bar,.ticker,.shape,body::before{display:none!important}
  body{background:#fff!important;color:#000!important}
  .layout{display:block}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .hero .badge,.hero h1,.hero .tagline,main section,.transition-question,.references{opacity:1!important;transform:none!important}
}
</style>
</head>
<body class="theme-light theme-memphis-pop">
<div id="progress-bar"></div>
<header class="topbar">
  <span class="logo">DEEP EXPLORER</span>
  <span class="actions">
    <button class="sticker-btn" id="theme-toggle" aria-label="切换明暗"><i data-lucide="moon"></i><span>LIGHT/DARK</span></button>
    <button class="sticker-btn" id="export-pdf" aria-label="导出 PDF"><i data-lucide="printer"></i><span>SAVE PDF</span></button>
  </span>
</header>
<div class="ticker" aria-hidden="true"><div class="ticker-track"><span>DEEP DIVE ★ {{WORD}} ★ 兴趣词汇解析 ★ NEW JERSEY ★ </span><span>DEEP DIVE ★ {{WORD}} ★ 兴趣词汇解析 ★ NEW JERSEY ★ </span></div></div>
<div class="hero">
  <span class="shape shape-a"></span>
  <span class="shape shape-b"></span>
  <span class="badge">DEEP DIVE · {{WORD}}</span>
  <h1 data-word="{{WORD}}">{{WORD}}</h1>
  <p class="tagline">{{TAGLINE}}</p>
</div>
<div class="layout">
  <main class="article-col">
    {{BODY}}
  </main>
  <aside class="rail" aria-label="目录与学习链">
    <div class="panel">
      <h3>目录</h3>
      <nav id="memphis-chips" aria-label="章节目录"></nav>
    </div>
    <div class="panel">
      <h3>学习链</h3>
      <nav id="chain-indicator" aria-label="学习链步骤"></nav>
    </div>
  </aside>
</div>
<footer class="article-footer">{{FOOTER}}</footer>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
lucide.createIcons();
var secs=[].slice.call(document.querySelectorAll('main section[data-chain]'));
var chips=document.getElementById('memphis-chips');
secs.forEach(function(s){
  var a=document.createElement('a');a.href='#'+s.id;
  a.textContent='STEP '+s.dataset.chain+' · '+s.querySelector('h2').textContent.replace(/[✦\s]/g,'');
  chips.appendChild(a);
});
var rail=document.getElementById('chain-indicator');
secs.forEach(function(s){
var d=document.createElement('div');d.className='step';d.textContent=String(Number(s.dataset.chain)).padStart(2,'0');
  d.addEventListener('click',function(){s.scrollIntoView({behavior:'smooth',block:'start'});});
  rail.appendChild(d);
});
var bar=document.getElementById('progress-bar');
function refresh(){
  var t=document.documentElement.scrollTop,h=document.documentElement.scrollHeight-window.innerHeight;
  bar.style.width=(h>0?t/h*100:0)+'%';
  var cur='';secs.forEach(function(s){if(t>=s.offsetTop-180)cur=s.id;});
  [].forEach.call(chips.querySelectorAll('a'),function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+cur);});
  [].forEach.call(rail.querySelectorAll('.step'),function(d){d.classList.toggle('active',d.textContent===cur.replace('chain-',''));});
}
window.addEventListener('scroll',refresh,{passive:true});refresh();
var reveal=[].slice.call(document.querySelectorAll('main section,.transition-question,.references'));
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:.1});
  reveal.forEach(function(el){io.observe(el);});
}else{reveal.forEach(function(el){el.classList.add('visible');});}
document.querySelectorAll('.abbr-term').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='tooltip';d.textContent=el.dataset.tooltip||el.title||'';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';
    requestAnimationFrame(function(){d.classList.add('show');});el._t=d;
  });
  el.addEventListener('mouseleave',function(){if(el._t){el._t.remove();el._t=null;}});
});
document.querySelectorAll('.citation-ref').forEach(function(el){
  el.addEventListener('mouseenter',function(){
    var d=document.createElement('div');d.className='cite-popup';d.textContent=el.dataset.citeText||'查看底部参考文献';
    document.body.appendChild(d);var r=el.getBoundingClientRect();
    d.style.left=Math.min(r.left,window.innerWidth-320)+'px';d.style.top=r.bottom+8+'px';
    requestAnimationFrame(function(){d.classList.add('show');});el._c=d;
  });
  el.addEventListener('mouseleave',function(){if(el._c){el._c.remove();el._c=null;}});
});
var tb=document.getElementById('theme-toggle');
function applyDark(dark){
  document.body.classList.toggle('theme-dark',dark);
  document.body.classList.toggle('theme-light',!dark);
  tb.querySelector('i').setAttribute('data-lucide',dark?'sun':'moon');
  tb.querySelector('span').textContent=dark?'DARK/LIGHT':'LIGHT/DARK';
  lucide.createIcons();
}
tb.addEventListener('click',function(){applyDark(!document.body.classList.contains('theme-dark'));});
if(localStorage.getItem('dw-theme')==='dark'){applyDark(true);}
document.getElementById('export-pdf').addEventListener('click',function(){window.print();});
</script>
</body>
</html>
