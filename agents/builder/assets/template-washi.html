<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{WORD}} · 深度解析 | WorkBuddy</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --ink:#2b2118;
  --ink-rgb:43,33,24;
  --paper:#faf5ea;
  --paper-rgb:250,245,234;
  --paper-tint:#f0e4cd;
  --ink-tint:#b23a2a;
  --serif-zh:"Noto Serif SC","Songti SC",SimSun,serif;
  --serif-en:"Playfair Display",Georgia,serif;
  --content-width:680px;
  --space-1:.25rem;
  --space-2:.5rem;
  --space-3:1rem;
  --space-4:1.75rem;
  --space-5:2.75rem;
  --space-6:4.5rem;
  --radius-sm:2px;
  --radius-md:6px;
  --radius-lg:12px;
  --shadow-sm:0 1px 3px rgba(var(--ink-rgb),.08);
  --shadow-md:0 3px 12px rgba(var(--ink-rgb),.14);
  --shadow-lg:0 8px 28px rgba(var(--ink-rgb),.2);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur-fast:150ms;
  --dur-med:350ms;
  --dur-slow:650ms
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{margin:0;font-family:var(--serif-zh);font-size:17px;line-height:2.05;background:var(--paper);color:var(--ink);overflow-x:hidden;background-image:radial-gradient(rgba(178,58,42,.035) 1px,transparent 1px);background-size:14px 14px;transition:background var(--dur-med) var(--ease-out),color var(--dur-med) var(--ease-out)}
body.theme-dark{background:var(--ink);color:var(--paper);background-image:radial-gradient(rgba(250,245,234,.05) 1px,transparent 1px)}
a{color:var(--ink-tint)}
::selection{background:var(--ink-tint);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink-tint);outline-offset:2px}
#progress-bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--ink-tint);z-index:400}
.masthead{position:sticky;top:0;z-index:200;background:var(--paper);border-bottom:3px double var(--ink-tint);padding:var(--space-3) var(--space-4) var(--space-4);transition:background var(--dur-med) var(--ease-out)}
body.theme-dark .masthead{background:var(--ink)}
.masthead .topline{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-2)}
.masthead .brand{font-size:.85rem;letter-spacing:.25em;color:var(--ink-tint);font-weight:600}
.masthead .actions{display:flex;gap:var(--space-2)}
.washi-btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);font-family:var(--serif-zh);font-size:.8rem;line-height:1;padding:.5rem .75rem;background:transparent;border:1px solid var(--ink-tint);color:var(--ink-tint);cursor:pointer;border-radius:var(--radius-sm);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.washi-btn:hover{background:var(--ink-tint);color:var(--paper);box-shadow:var(--shadow-sm)}
.washi-btn:active{transform:translateY(1px)}
.washi-btn svg{width:14px;height:14px}
#washi-index{display:flex;gap:.35rem;flex-wrap:wrap;font-size:.8rem}
#washi-index a{text-decoration:none;color:var(--ink);border:1px solid transparent;padding:.1rem .4rem;letter-spacing:.06em;border-radius:var(--radius-sm);transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out)}
#washi-index a:hover{color:var(--ink-tint);border-color:var(--paper-tint)}
#washi-index a.active{color:var(--ink-tint);border-color:var(--ink-tint);background:rgba(178,58,42,.05)}
body.theme-dark #washi-index a{color:var(--paper)}
body.theme-dark #washi-index a:hover{color:var(--paper);border-color:rgba(250,245,234,.25)}
body.theme-dark #washi-index a.active{color:var(--paper);border-color:var(--ink-tint);background:rgba(178,58,42,.18)}
.hero{max-width:var(--content-width);margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-5);text-align:center}
.hero .kicker{font-size:.85rem;letter-spacing:.35em;text-transform:uppercase;color:var(--ink-tint);margin:0 0 var(--space-3)}
.hero .kicker::before{content:"— "}
.hero .kicker::after{content:" —"}
.hero h1{font-size:clamp(2.3rem,6vw,4.2rem);letter-spacing:.08em;line-height:1.3;margin:0 0 var(--space-4);font-weight:700}
.hero h1::after{content:"印";display:inline-block;margin-left:.55em;font-size:.3em;line-height:1;letter-spacing:0;color:var(--paper);background:var(--ink-tint);border:2px solid var(--ink-tint);border-radius:var(--radius-sm);padding:.18em .24em;vertical-align:middle;box-shadow:var(--shadow-sm);animation:seal-stamp var(--dur-slow) var(--ease-out) .25s both}
@keyframes seal-stamp{0%{opacity:0;transform:scale(1.35)}55%{opacity:1;transform:scale(1)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
.hero .tagline{max-width:56ch;margin:0 auto;font-size:1.02rem;line-height:2.05;color:var(--ink);opacity:.85}
body.theme-dark .hero .tagline{color:var(--paper)}
.hero .kicker,.hero h1,.hero .tagline{opacity:0;transform:translateY(18px);animation:hero-up var(--dur-med) var(--ease-out) forwards}
.hero .kicker{animation-delay:0ms}
.hero h1{animation-delay:120ms}
.hero .tagline{animation-delay:240ms}
@keyframes hero-up{to{opacity:1;transform:translateY(0)}}
.wrap{max-width:var(--content-width);margin:0 auto;padding:0 var(--space-4) var(--space-6)}
main section{margin:var(--space-5) 0;padding-top:var(--space-3);opacity:0;transform:translateY(24px);transition:opacity var(--dur-med) var(--ease-out),transform var(--dur-med) var(--ease-out)}
main section.visible{opacity:1;transform:translateY(0)}
main section h2{font-size:1.5rem;letter-spacing:.08em;border-bottom:1px solid var(--paper-tint);padding-bottom:.55rem;margin:0 0 var(--space-4);background-image:linear-gradient(var(--ink-tint),var(--ink-tint));background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;transition:background-size var(--dur-slow) var(--ease-out)}
main section.visible h2{background-size:100% 1px}
main section h2::after{content:"﹅";color:var(--ink-tint);margin-left:.45em;font-size:.75em}
main section h3{font-size:1.12rem;letter-spacing:.06em;margin:var(--space-4) 0 var(--space-2)}
main section h4{font-size:1rem;margin:var(--space-3) 0 var(--space-2)}
main section p{margin:.6rem 0;text-align:justify}
main section ul,main section ol{margin:.6rem 0;padding-left:1.5rem}
main section li{margin:.4rem 0}
.transition-question{text-align:center;margin:var(--space-5) 0;font-size:1.3rem;letter-spacing:.06em;opacity:0;transform:translateY(24px);transition:opacity var(--dur-med) var(--ease-out),transform var(--dur-med) var(--ease-out)}
.transition-question.visible{opacity:1;transform:translateY(0)}
.transition-question p{margin:0}
.transition-question p::before,.transition-question p::after{content:"❖";color:var(--ink-tint);margin:0 .5em;font-size:.7em;vertical-align:middle}
.callout{border-left:3px solid var(--ink-tint);background:rgba(178,58,42,.05);padding:.6rem 1.1rem;margin:var(--space-3) 0;border-radius:0 var(--radius-md) var(--radius-md) 0}
body.theme-dark .callout{background:rgba(250,245,234,.06)}
.lead{font-size:1.05rem}
.timeline-list{list-style:none;padding:0}
.timeline-list li{padding-left:1.4rem;position:relative;margin:.5rem 0}
.timeline-list li::before{content:"◆";position:absolute;left:0;color:var(--ink-tint);font-size:.7em;top:.55em}
.stat-row{display:flex;flex-wrap:wrap;gap:1.6rem;margin:var(--space-3) 0}
.stat-item .num{font-size:1.7rem;color:var(--ink-tint)}
.big-num{font-size:2.1rem;color:var(--ink-tint)}
.comparison-table{width:100%;border-collapse:collapse;margin:var(--space-3) 0;font-size:.92rem}
.comparison-table th,.comparison-table td{border:1px solid var(--paper-tint);padding:.55rem .7rem;text-align:left}
.comparison-table th{background:rgba(178,58,42,.05)}
body.theme-dark .comparison-table th{background:rgba(250,245,234,.06)}
.references{margin-top:var(--space-6);padding-top:var(--space-4);border-top:3px double var(--ink-tint);opacity:0;transform:translateY(24px);transition:opacity var(--dur-med) var(--ease-out),transform var(--dur-med) var(--ease-out)}
.references.visible{opacity:1;transform:translateY(0)}
.references h2{font-size:1.3rem;letter-spacing:.1em}
.references ol{line-height:2;padding-left:1.4rem}
.references a{word-break:break-all;overflow-wrap:anywhere}
.abbr-term{text-decoration:underline dotted var(--ink-tint);text-underline-offset:3px;cursor:help}
.citation-ref{color:var(--ink-tint);font-size:.72em;vertical-align:super;cursor:pointer;text-decoration:none;opacity:.8;transition:opacity var(--dur-fast) var(--ease-out)}
.citation-ref:hover{opacity:1}
.tooltip,.cite-popup{position:fixed;z-index:500;max-width:300px;padding:.6rem .9rem;font-size:.85rem;line-height:1.75;background:var(--paper);color:var(--ink);border:1px solid var(--ink-tint);border-radius:var(--radius-md);box-shadow:var(--shadow-md);pointer-events:none}
body.theme-dark .tooltip,body.theme-dark .cite-popup{background:var(--ink-tint);color:var(--paper);border-color:rgba(250,245,234,.25)}
#chain-indicator{position:fixed;right:max(1rem,calc((100vw - var(--content-width))/2 - 46px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.55rem;z-index:300}
#chain-indicator .stamp{width:17px;height:17px;border:1px solid var(--ink-tint);color:var(--ink-tint);font-size:.62rem;line-height:15px;text-align:center;cursor:pointer;border-radius:var(--radius-sm);background:var(--paper);box-shadow:var(--shadow-sm);transition:background var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
#chain-indicator .stamp:hover{transform:translateY(-1px) scale(1.08)}
#chain-indicator .stamp.active{background:var(--ink-tint);color:var(--paper)}
body.theme-dark #chain-indicator .stamp{background:var(--ink);color:var(--paper)}
.article-footer{text-align:center;padding:var(--space-5) var(--space-4) var(--space-6);font-size:.8rem;letter-spacing:.12em;color:var(--ink);opacity:.65;border-top:3px double var(--ink-tint)}
body.theme-dark .article-footer{color:var(--paper)}
@media(max-width:900px){#chain-indicator{display:none}}
@media(max-width:768px){
  .masthead{padding:var(--space-2) var(--space-3) var(--space-3)}
  .hero{padding-top:var(--space-5)}
  .wrap{padding:0 var(--space-3) var(--space-5)}
  main section h2{font-size:1.25rem}
  .transition-question{font-size:1.05rem}
  .hero h1{letter-spacing:.06em}
}
@media print{
  .masthead,#chain-indicator,.washi-btn,#progress-bar{display:none!important}
  body{background:#fff!important;color:#000!important;background-image:none!important}
  .hero .kicker,.hero h1,.hero .tagline,main section,.transition-question,.references{opacity:1!important;transform:none!important}
  .hero h1::after{animation:none!important}
  .wrap{max-width:100%!important}
  main section{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .hero .kicker,.hero h1,.hero .tagline,main section,.transition-question,.references{opacity:1!important;transform:none!important}
  .hero h1::after{animation:none!important}
}
</style>
</head>
<body class="theme-light theme-vermilion-washi">
<div id="progress-bar"></div>
<header class="masthead">
  <div class="topline">
    <span class="brand">兴趣词汇解析</span>
    <span class="actions">
      <button class="washi-btn" id="theme-toggle" aria-label="切换明暗" title="切换明暗"><i data-lucide="moon"></i></button>
      <button class="washi-btn" id="export-pdf" aria-label="导出 PDF" title="导出 PDF"><i data-lucide="printer"></i></button>
    </span>
  </div>
  <nav id="washi-index" aria-label="章节索引"></nav>
</header>
<div class="hero">
  <p class="kicker">深度解析 · DEEP DIVE</p>
  <h1>{{WORD}}</h1>
  <p class="tagline">{{TAGLINE}}</p>
</div>
<main class="wrap">
{{BODY}}
</main>
<footer class="article-footer">{{FOOTER}}</footer>
<nav id="chain-indicator" aria-label="学习链指示"></nav>
<script>
(function(){
  lucide.createIcons();
  var secs=[].slice.call(document.querySelectorAll('main section[data-chain]'));
  var nums=['一','二','三','四','五','六'];
  var idx=document.getElementById('washi-index');
  if(idx){
    secs.forEach(function(s){
      var a=document.createElement('a');
      a.href='#'+s.id;
      var h2=s.querySelector('h2');
      a.textContent=(nums[parseInt(s.dataset.chain,10)-1]||s.dataset.chain)+' · '+(h2?h2.textContent.replace(/[﹅\s]/g,''):'');
      idx.appendChild(a);
    });
  }
  var rail=document.getElementById('chain-indicator');
  if(rail){
    secs.forEach(function(s){
      var d=document.createElement('div');
      d.className='stamp';
      d.textContent=s.dataset.chain;
      d.title='第'+(nums[parseInt(s.dataset.chain,10)-1]||s.dataset.chain)+'阶';
      d.setAttribute('aria-label',d.title);
      d.addEventListener('click',function(){s.scrollIntoView({behavior:'smooth',block:'start'});});
      rail.appendChild(d);
    });
  }
  function refresh(){
    var doc=document.documentElement;
    var t=doc.scrollTop||document.body.scrollTop;
    var h=doc.scrollHeight-window.innerHeight;
    document.getElementById('progress-bar').style.width=(h>0?t/h*100:0)+'%';
    var cur='';
    secs.forEach(function(s){if(t>=s.offsetTop-180)cur=s.id;});
    if(idx){[].forEach.call(idx.querySelectorAll('a'),function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+cur);});}
    if(rail){[].forEach.call(rail.querySelectorAll('.stamp'),function(d){d.classList.toggle('active',d.textContent===cur.replace('chain-',''));});}
  }
  window.addEventListener('scroll',refresh,{passive:true});
  window.addEventListener('resize',refresh,{passive:true});
  refresh();
  document.querySelectorAll('.abbr-term').forEach(function(el){
    el.addEventListener('mouseenter',function(){
      var d=document.createElement('div');
      d.className='tooltip';
      d.textContent=el.dataset.tooltip||el.title||'';
      document.body.appendChild(d);
      var r=el.getBoundingClientRect();
      d.style.left=Math.min(r.left,window.innerWidth-320)+'px';
      d.style.top=r.bottom+8+'px';
      el._t=d;
    });
    el.addEventListener('mouseleave',function(){if(el._t){el._t.remove();el._t=null;}});
  });
  document.querySelectorAll('.citation-ref').forEach(function(el){
    el.addEventListener('mouseenter',function(){
      var d=document.createElement('div');
      d.className='cite-popup';
      d.textContent=el.dataset.citeText||'查看底部参考文献';
      document.body.appendChild(d);
      var r=el.getBoundingClientRect();
      d.style.left=Math.min(r.left,window.innerWidth-320)+'px';
      d.style.top=r.bottom+8+'px';
      el._c=d;
    });
    el.addEventListener('mouseleave',function(){if(el._c){el._c.remove();el._c=null;}});
  });
  var tb=document.getElementById('theme-toggle');
  var tbIcon=tb?tb.querySelector('i'):null;
  function setIcon(dark){
    if(tbIcon){
      tbIcon.setAttribute('data-lucide',dark?'sun':'moon');
      lucide.createIcons();
    }
  }
  if(tb){
    if(localStorage.getItem('dw-theme')==='dark'){
      document.body.classList.add('theme-dark');
      document.body.classList.remove('theme-light');
      setIcon(true);
    }
    tb.addEventListener('click',function(){
      var dark=document.body.classList.toggle('theme-dark');
      document.body.classList.toggle('theme-light');
      setIcon(dark);
      localStorage.setItem('dw-theme',dark?'dark':'light');
    });
  }
  document.getElementById('export-pdf').addEventListener('click',function(){window.print();});
  var revealTargets=[].slice.call(document.querySelectorAll('main section,.transition-question,.references'));
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          en.target.classList.add('visible');
          io.unobserve(en.target);
        }
      });
    },{rootMargin:'0px 0px -10% 0px',threshold:0.05});
    revealTargets.forEach(function(el){io.observe(el);});
  }else{
    revealTargets.forEach(function(el){el.classList.add('visible');});
  }
})();
</script>
</body>
</html>
