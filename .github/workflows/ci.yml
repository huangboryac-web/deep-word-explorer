name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install jsonschema
      - name: Run repository validation
        run: python scripts/validate.py
      - name: Verify golden profiles are up to date
        run: |
          python scripts/generate_goldens.py
          git diff --exit-code -- tests/goldens/classification-profiles.json
